                  - /url: https://nanoporetech.com/
                - text: . I lead a team of software engineers and make internal developer tools that, ideally, prevent other engineers from wanting to throw their laptops into the sea.
              - paragraph [ref=e127]: Eight years of doing this has taken me across the entire stack. C systems programming. React web apps. Robotics middleware. Python CLI tools. If it involves making software work or more often, figuring out why it doesn’t, I’ve probably touched it.
              - paragraph [ref=e128]: I care about developer experience, observability tooling, and building systems that make engineers productive instead of miserable. These are related goals.
              - paragraph [ref=e129]: When I’m not writing code or pretending to know what I’m doing in meetings, I’m exploring AI-assisted development and tinkering with whatever technology seems interesting enough to justify the time investment.
