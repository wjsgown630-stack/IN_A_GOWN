        - generic [ref=e43]:
          - paragraph [ref=e44]: I'm Alexander Horner, a software engineer based in Hamburg, Germany, studying Computer Science at Hamburg University of Technology. I work across frontend and backend and bring particularly strong frontend engineering experience. I care about clear interfaces, maintainable systems, and building complete features from requirements through implementation.
          - paragraph [ref=e45]: I currently work at T-Systems IFS in System Engineering Defence, contributing to the frontend of a training system for the Danish Navy using Angular, TypeScript, deck.gl, and map-based interfaces. T-Systems IFS develops Classified IT for internal and external security and for authorities with particularly high security requirements.
          - paragraph [ref=e46]: Before that, I worked at AKRA on the redevelopment of a job-matching platform used by more than 225,000 users and 7,000 employers. My work grew from frontend implementation into broader technical ownership across frontend and backend development, UI design, deployment, client communication, and product decisions, using Nuxt, Go, PostgreSQL, authentication, and geosearch. I also developed an AI-agent prototype for internal talent and consultant management.
